[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "shotbuddy"
version = "4.1.0"
description = "AI filmmaking asset manager"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Taruma Sakti" },
  { name = "Albert Bozesan" }
]
requires-python = ">=3.13.1"
dependencies = [
  "flask",
  "flask-cors",
  "pillow",
  "python-dotenv>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/taruma/shotbase"
Repository = "https://github.com/taruma/shotbase"
Issues = "https://github.com/taruma/shotbase/issues"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.13.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]  # Style, Pyflakes, isort, pyupgrade, security
ignore = ["E501", "S603"]  # Ignore line length and subprocess untrusted input for trusted calls
